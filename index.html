<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.1; filterBeta:10;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <video id="video1" src="./vide-ar-1.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="video2" src="./vide-ar-2.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="video3" src="./vide-ar-3.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="video4" src="./vide-ar-4.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="video5" src="./vide-ar-5.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="video6" src="./vide-ar-6.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="video7" src="./vide-ar-7.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="video8" src="./vide-ar-8.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 1 -->
      <a-entity id="target0" mindar-image-target="targetIndex: 0">
        <a-video
          src="#video1"
          position="0 0 0"
          width="1"
          height="0.6"
          rotation="0 0 0">
        </a-video>
      </a-entity>

      <!-- Target 2 -->
      <a-entity id="target1" mindar-image-target="targetIndex: 1">
        <a-video
          src="#video2"
          position="0 0 0"
          width="1"
          height="0.6"
          rotation="0 0 0">
        </a-video>
      </a-entity>

      <!-- Target 3 -->
      <a-entity id="target2" mindar-image-target="targetIndex: 2">
        <a-video
          src="#video3"
          position="0 0 0"
          width="1"
          height="0.6"
          rotation="0 0 0">
        </a-video>
      </a-entity>

      <!-- Target 4 -->
      <a-entity id="target3" mindar-image-target="targetIndex: 3">
        <a-video
          src="#video4"
          position="0 0 0"
          width="1"
          height="0.6"
          rotation="0 0 0">
        </a-video>
      </a-entity>

      <!-- Target 5 -->
      <a-entity id="target4" mindar-image-target="targetIndex: 4">
        <a-video
          src="#video5"
          position="0 0 0"
          width="1"
          height="0.6"
          rotation="0 0 0">
        </a-video>
      </a-entity>

      <!-- Target 6 -->
      <a-entity id="target5" mindar-image-target="targetIndex: 5">
        <a-video
          src="#video6"
          position="0 0 0"
          width="1"
          height="0.6"
          rotation="0 0 0">
        </a-video>
      </a-entity>

      <!-- Target 7 -->
      <a-entity id="target6" mindar-image-target="targetIndex: 6">
        <a-video
          src="#video7"
          position="0 0 0"
          width="1"
          height="0.6"
          rotation="0 0 0">
        </a-video>
      </a-entity>

      <!-- Target 8 -->
      <a-entity id="target7" mindar-image-target="targetIndex: 7">
        <a-video
          src="#video8"
          position="0 0 0"
          width="1"
          height="0.6"
          rotation="0 0 0">
        </a-video>
      </a-entity>

    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const videos = [
          document.querySelector("#video1"),
          document.querySelector("#video2"),
          document.querySelector("#video3"),
          document.querySelector("#video4"),
          document.querySelector("#video5"),
          document.querySelector("#video6"),
          document.querySelector("#video7"),
          document.querySelector("#video8")
        ];

        const targets = [
          document.querySelector("#target0"),
          document.querySelector("#target1"),
          document.querySelector("#target2"),
          document.querySelector("#target3"),
          document.querySelector("#target4"),
          document.querySelector("#target5"),
          document.querySelector("#target6"),
          document.querySelector("#target7")
        ];

        videos.forEach((video) => {
          video.pause();
          video.currentTime = 0;
        });

        targets.forEach((target, index) => {
          const video = videos[index];

          target.addEventListener("targetFound", () => {
            videos.forEach((v) => {
              if (v !== video) {
                v.pause();
              }
            });

            video.play().catch((error) => {
              console.log("El video no pudo reproducirse automáticamente:", error);
            });
          });

          target.addEventListener("targetLost", () => {
            video.pause();
          });
        });
      });
    </script>
  </body>
</html>
