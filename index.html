<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.1; filterBeta:10;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <video id="video1" src="./video-ar-1.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
        <video id="video2" src="./video-ar-2.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
        <video id="video3" src="./video-ar-3.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
        <video id="video4" src="./video-ar-4.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
        <video id="video5" src="./video-ar-5.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
        <video id="video6" src="./video-ar-6.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
        <video id="video7" src="./video-ar-7.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
        <video id="video8" src="./video-ar-8.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- TARGET 1 / INSTALACIÓN 1 -->
      <a-entity id="target0" mindar-image-target="targetIndex: 0">

        <!-- video principal al centro -->
        <a-video
          src="#video1"
          position="0 0 0"
          width="1"
          height="0.65">
        </a-video>

        <!-- video flotante arriba -->
        <a-video
          src="#video2"
          position="0 0.75 0.05"
          width="0.55"
          height="0.35"
          rotation="0 0 8">
        </a-video>

        <!-- video flotante izquierda -->
        <a-video
          src="#video3"
          position="-0.75 0.15 0.08"
          width="0.45"
          height="0.6"
          rotation="0 0 -10">
        </a-video>

        <!-- video flotante derecha -->
        <a-video
          src="#video4"
          position="0.75 0.1 0.08"
          width="0.45"
          height="0.6"
          rotation="0 0 10">
        </a-video>

        <!-- video flotante abajo -->
        <a-video
          src="#video5"
          position="0 -0.75 0.06"
          width="0.65"
          height="0.4"
          rotation="0 0 -5">
        </a-video>

      </a-entity>

      <!-- TARGET 2 -->
      <a-entity id="target1" mindar-image-target="targetIndex: 1">
        <a-video src="#video2" position="0 0 0" width="1" height="0.65"></a-video>
        <a-video src="#video6" position="-0.7 0.4 0.08" width="0.45" height="0.55" rotation="0 0 -12"></a-video>
        <a-video src="#video7" position="0.7 0.35 0.08" width="0.45" height="0.55" rotation="0 0 12"></a-video>
        <a-video src="#video8" position="0 -0.7 0.08" width="0.65" height="0.4" rotation="0 0 4"></a-video>
      </a-entity>

      <!-- TARGET 3 -->
      <a-entity id="target2" mindar-image-target="targetIndex: 2">
        <a-video src="#video3" position="0 0 0" width="1" height="0.65"></a-video>
        <a-video src="#video1" position="-0.75 0.1 0.08" width="0.45" height="0.55" rotation="0 0 -10"></a-video>
        <a-video src="#video4" position="0.75 0.1 0.08" width="0.45" height="0.55" rotation="0 0 10"></a-video>
        <a-video src="#video5" position="0 0.75 0.08" width="0.6" height="0.38" rotation="0 0 -6"></a-video>
      </a-entity>

      <!-- TARGET 4 -->
      <a-entity id="target3" mindar-image-target="targetIndex: 3">
        <a-video src="#video4" position="0 0 0" width="1" height="0.65"></a-video>
        <a-video src="#video2" position="-0.65 0.45 0.08" width="0.45" height="0.55" rotation="0 0 -12"></a-video>
        <a-video src="#video6" position="0.65 0.45 0.08" width="0.45" height="0.55" rotation="0 0 12"></a-video>
      </a-entity>

      <!-- TARGET 5 -->
      <a-entity id="target4" mindar-image-target="targetIndex: 4">
        <a-video src="#video5" position="0 0 0" width="1" height="0.65"></a-video>
        <a-video src="#video1" position="-0.7 0.4 0.08" width="0.45" height="0.55" rotation="0 0 -8"></a-video>
        <a-video src="#video8" position="0.7 0.4 0.08" width="0.45" height="0.55" rotation="0 0 8"></a-video>
      </a-entity>

      <!-- TARGET 6 -->
      <a-entity id="target5" mindar-image-target="targetIndex: 5">
        <a-video src="#video6" position="0 0 0" width="1" height="0.65"></a-video>
        <a-video src="#video3" position="-0.75 0.25 0.08" width="0.45" height="0.55" rotation="0 0 -10"></a-video>
        <a-video src="#video7" position="0.75 0.25 0.08" width="0.45" height="0.55" rotation="0 0 10"></a-video>
      </a-entity>

      <!-- TARGET 7 -->
      <a-entity id="target6" mindar-image-target="targetIndex: 6">
        <a-video src="#video7" position="0 0 0" width="1" height="0.65"></a-video>
        <a-video src="#video2" position="-0.7 -0.45 0.08" width="0.45" height="0.55" rotation="0 0 9"></a-video>
        <a-video src="#video4" position="0.7 -0.45 0.08" width="0.45" height="0.55" rotation="0 0 -9"></a-video>
      </a-entity>

      <!-- TARGET 8 -->
      <a-entity id="target7" mindar-image-target="targetIndex: 7">
        <a-video src="#video8" position="0 0 0" width="1" height="0.65"></a-video>
        <a-video src="#video1" position="-0.7 0.45 0.08" width="0.45" height="0.55" rotation="0 0 -12"></a-video>
        <a-video src="#video3" position="0.7 0.45 0.08" width="0.45" height="0.55" rotation="0 0 12"></a-video>
      </a-entity>

    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const videos = [
          document.querySelector("#video1"),
          document.querySelector("#video2"),
          document.querySelector("#video3"),
          document.querySelector("#video4"),
          document.querySelector("#video5"),
          document.querySelector("#video6"),
          document.querySelector("#video7"),
          document.querySelector("#video8")
        ];

        const targets = [
          document.querySelector("#target0"),
          document.querySelector("#target1"),
          document.querySelector("#target2"),
          document.querySelector("#target3"),
          document.querySelector("#target4"),
          document.querySelector("#target5"),
          document.querySelector("#target6"),
          document.querySelector("#target7")
        ];

        videos.forEach((video) => {
          video.pause();
          video.currentTime = 0;
        });

        targets.forEach((target) => {
          target.addEventListener("targetFound", () => {
            videos.forEach((video) => {
              video.play().catch((error) => {
                console.log("No se pudo reproducir:", error);
              });
            });
          });

          target.addEventListener("targetLost", () => {
            videos.forEach((video) => {
              video.pause();
            });
          });
        });
      });
    </script>
  </body>
</html>
